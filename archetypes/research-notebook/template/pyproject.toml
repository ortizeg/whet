[project]
name = "${project_slug}"
version = "0.1.0"
description = "${description}"
authors = [{name = "${author}"}]
requires-python = ">=${python_version}"
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "loguru>=0.7",
]

[project.optional-dependencies]
# Notebook tooling is deliberately an extra: the importable package in src/ must
# never require Jupyter to be installed.
notebook = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbstripout>=0.7",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.8",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/${package_name}"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/.ipynb_checkpoints"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "T20", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "${python_version}"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "mpl_toolkits.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
filterwarnings = ["error::DeprecationWarning"]
