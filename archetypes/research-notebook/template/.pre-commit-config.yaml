# Pre-commit hooks for ${project_name}.
#
# The hook that matters most here is nbstripout: it removes execution counts and
# cell outputs before anything reaches git. Without it, every rerun of a notebook
# produces a multi-megabyte binary diff and a guaranteed merge conflict. With it,
# notebooks diff like source files.
#
#     pre-commit install
#     pre-commit run --all-files

default_language_version:
  python: python3

repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        name: strip notebook outputs (keeps notebooks diff-able)
        files: \.ipynb$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.ipynb$
      - id: end-of-file-fixer
        exclude: \.ipynb$
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: ["--strict", "--ignore-missing-imports"]
        files: ^(src|tests)/
        additional_dependencies:
          - pydantic>=2.6
          - numpy>=1.26
          - pytest>=7.4
