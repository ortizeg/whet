[project]
name = "${project_slug}"
version = "0.1.0"
description = "${description}"
authors = ["${author}"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[activation.env]
# src-layout: make the package importable without an editable install.
PYTHONPATH = "src"

[dependencies]
python = ">=${python_version}"
pydantic = ">=2.6"
loguru = ">=0.7"
polars = ">=1.0"

[feature.dev.dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"
ruff = ">=0.8"
mypy = ">=1.11"

[environments]
default = { features = ["dev"], solve-group = "default" }

[tasks]
sample = "python -m ${package_name} sample --root data/raw"
scan = "python -m ${package_name} scan --config conf/pipeline.toml"
run = "python -m ${package_name} run --config conf/pipeline.toml"
validate = "python -m ${package_name} validate --config conf/pipeline.toml"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "mypy src/ --strict"
quality = { depends-on = ["lint", "format-check", "typecheck", "test"] }
