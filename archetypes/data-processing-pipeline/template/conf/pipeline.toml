# Pipeline configuration — validated by ${package_name}.config.PipelineConfig at load time.
# Paths are relative to the directory you run the pipeline from (the project root).

name = "${project_slug}"

[ingest]
# Expected layout: <root>/<label>/<group_id>/<file>
#   data/raw/goal/match_0007/frame_000123.png
root = "data/raw"
extensions = [".png", ".jpg", ".jpeg"]
label_depth = 0
group_depth = 1

[quality]
min_file_bytes = 1
min_records_per_label = 1
min_groups_per_label = 2
allow_duplicate_content = false

[split]
train_ratio = 0.7
val_ratio = 0.15
test_ratio = 0.15
seed = 42
# The leakage guard. Set to a real grouping key (clip, patient, match, session)
# and never remove it unless samples are genuinely independent.
group_column = "group_id"
stratify_column = "label"

[output]
processed_dir = "data/processed"
compression = "zstd"
