[workspace]
name = "${project_slug}"
version = "0.1.0"
description = "${description}"
authors = ["${author}"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[activation.env]
# src-layout: make the package importable without an editable install.
PYTHONPATH = "src"
# Where verified weight files are cached.
MODEL_WEIGHTS_CACHE = ".cache/weights"
# Where model-card YAML files are discovered.
MODEL_REGISTRY_DIR = "registry"

[dependencies]
python = ">=${python_version}"
pydantic = ">=2.6"
pyyaml = ">=6.0"
httpx = ">=0.27"

[pypi-dependencies]
loguru = ">=0.7"

[feature.dev.dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"
ruff = ">=0.8"
mypy = ">=1.11"

[feature.dev.pypi-dependencies]
types-pyyaml = ">=6.0"

# Optional: only needed to benchmark real PyTorch models.
[feature.torch.dependencies]
pytorch = ">=2.0"
torchvision = ">=0.16"

[environments]
default = { features = ["dev"], solve-group = "default" }
torch = { features = ["dev", "torch"] }

[tasks]
models = "python -m ${package_name} list"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "mypy src/ --strict"
quality = { depends-on = ["lint", "format-check", "typecheck", "test"] }
