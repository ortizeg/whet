[project]
name = "${project_slug}"
version = "0.1.0"
description = "${description}"
authors = [{name = "${author}"}]
readme = "README.md"
requires-python = ">=${python_version}"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.8",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]
# Optional: only needed to benchmark real PyTorch models. The registry,
# download-and-verify, and benchmark harness all work without it.
torch = [
    "torch>=2.0",
    "torchvision>=0.16",
]

[project.scripts]
${project_slug} = "${package_name}.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/${package_name}"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "T20", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "${python_version}"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
