[project]
name = "${project_slug}"
version = "0.1.0"
description = "${description}"
authors = ["${author}"]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[activation.env]
# src-layout: make the package importable without an editable install.
PYTHONPATH = "src"

[dependencies]
# Pinned to the minor series: onnxruntime only publishes wheels for released
# CPython minors, so an open-ended ">=" range resolves to a Python with no
# onnxruntime build available.
python = "${python_version}.*"
numpy = ">=1.26"
pillow = ">=10.0"

[pypi-dependencies]
fastapi = ">=0.110"
uvicorn = { version = ">=0.27", extras = ["standard"] }
pydantic = ">=2.6"
pydantic-settings = ">=2.2"
loguru = ">=0.7"
onnxruntime = ">=1.17"
python-multipart = ">=0.0.9"

[feature.dev.dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"
ruff = ">=0.8"
mypy = ">=1.11"

[feature.dev.pypi-dependencies]
pytest-asyncio = ">=0.23"
httpx = ">=0.27"

[environments]
default = { features = ["dev"], solve-group = "default" }

[tasks]
serve = "uvicorn ${package_name}.app:app --host 0.0.0.0 --port 8000"
dev = "uvicorn ${package_name}.app:app --reload --port 8000"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "mypy src/ --strict"
quality = { depends-on = ["lint", "format-check", "typecheck", "test"] }
