[workspace]
name = "${project_slug}"
version = "0.1.0"
description = "${description}"
authors = ["${author}"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=${python_version}"

[pypi-dependencies]
torch = ">=2.2"
torchvision = ">=0.17"
lightning = ">=2.2"
torchmetrics = ">=1.3"
hydra-core = ">=1.3"
pydantic = ">=2.6"
loguru = ">=0.7"
${project_slug} = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"
ruff = ">=0.8"
mypy = ">=1.11"

[environments]
default = { features = ["dev"], solve-group = "default" }

[tasks]
train = "python -m ${package_name}.train"
debug = "python -m ${package_name}.train trainer=debug"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy src/ --strict"
