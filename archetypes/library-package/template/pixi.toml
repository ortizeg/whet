[project]
name = "${project_slug}"
version = "0.1.0"
description = "${description}"
authors = ["${author}"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[activation.env]
# src-layout: make the package importable without an editable install.
PYTHONPATH = "src"

[dependencies]
# Pinned to the minor series so the dev environment matches the CI matrix floor.
python = "${python_version}.*"

[pypi-dependencies]
loguru = ">=0.7"
pydantic = ">=2.6"

[feature.dev.dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"
ruff = ">=0.8"
mypy = ">=1.11"
pre-commit = ">=3.5"

[feature.dev.pypi-dependencies]
build = ">=1.2"
twine = ">=5.1"

[feature.docs.pypi-dependencies]
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"
mkdocstrings = { version = ">=0.26", extras = ["python"] }

[environments]
default = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[tasks]
test = "pytest"
cov = "pytest --cov --cov-report=term-missing"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "mypy src/ --strict"
quality = { depends-on = ["lint", "format-check", "typecheck", "test"] }
build = "python -m build"
publish-test = "twine upload --repository testpypi dist/*"
publish = "twine upload dist/*"
cli = "python -m ${package_name}.cli"

[feature.docs.tasks]
docs-serve = "mkdocs serve"
docs-build = "mkdocs build --strict"
